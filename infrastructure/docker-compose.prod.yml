# VibeGPT – Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# SECURITY TOPOLOGY:
#   - Only Caddy publishes 80/443; every other service is internal-only.
#   - Containers drop all capabilities, enable no-new-privileges, and carry
#     PID + memory limits sized for a ~1 OCPU / 6 GB VPS (plus 2 GB swap —
#     see docs/vps-hardening.md). Tune mem_limit values to your hardware.
#   - Ollama is reachable only from the private Docker network.

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Caddy Reverse Proxy ────────────────────────────────────
  caddy:
    <<: *hardened
    image: caddy:2-alpine
    container_name: vibegpt-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 192m
    depends_on:
      - api
      - web
    restart: unless-stopped
    networks:
      - vibegpt

  # ── Next.js Web App ────────────────────────────────────────
  web:
    <<: *hardened
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: vibegpt-web
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    expose:
      - "3000"
    pids_limit: 100
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - vibegpt

  # ── FastAPI Backend ────────────────────────────────────────
  api:
    <<: *hardened
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: vibegpt-api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHICS_SERVICE_URL: http://graphics:8010
      APP_ENV: production
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    pids_limit: 256
    mem_limit: 1536m
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      graphics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - vibegpt

  graphics:
    <<: *hardened
    build:
      context: ../../GraphicsPythonVibeGPT/backend
      dockerfile: Dockerfile
    container_name: vibegpt-graphics
    expose:
      - "8010"
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - vibegpt

  # ── Document Worker ────────────────────────────────────────
  worker:
    <<: *hardened
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: vibegpt-worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: http://ollama:11434
      APP_ENV: production
    volumes:
      - uploads:/app/uploads
    pids_limit: 256
    mem_limit: 1536m
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    command: python -m app.workers.document_worker
    networks:
      - vibegpt

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    <<: *hardened
    image: pgvector/pgvector:pg16
    container_name: vibegpt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    pids_limit: 256
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vibegpt

  # ── Ollama LLM (private network only — never published) ────
  ollama:
    <<: *hardened
    # Pin to a tested release before production rollout (e.g. ollama/ollama:0.9.x).
    image: ollama/ollama:latest
    container_name: vibegpt-ollama
    volumes:
      - ollama_data:/root/.ollama
    pids_limit: 128
    mem_limit: 2560m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - vibegpt

  ollama-init:
    <<: *hardened
    image: ollama/ollama:latest
    container_name: vibegpt-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    pids_limit: 64
    mem_limit: 512m
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - vibegpt

volumes:
  pgdata:
    driver: local
  ollama_data:
    driver: local
  uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  vibegpt:
    driver: bridge

# VibeGPT – Local Development Docker Compose
# Usage: docker compose up -d
#
# SECURITY: service ports are bound to 127.0.0.1 (loopback) only, so the
# database, LLM, API and web are never reachable from the LAN/internet.
# The LLM gateway is likewise loopback-only. For the production topology
# (Caddy as the only public entry point) use docker-compose.prod.yml.

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    # PostgreSQL must adjust ownership on its persistent data volume before it
    # drops privileges; dropping all capabilities blocks that initialization.
    image: pgvector/pgvector:pg16
    container_name: vibegpt-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vibegpt}
      POSTGRES_USER: ${POSTGRES_USER:-vibegpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibegpt_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibegpt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama LLM ────────────────────────────────────────────
  ollama:
    <<: *hardened
    image: ollama/ollama:latest
    container_name: vibegpt-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ollama-init:
    <<: *hardened
    image: ollama/ollama:latest
    container_name: vibegpt-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── LLM Gateway Router (OmniRoute, OpenAI-compatible) ─────
  # Dashboard: http://localhost:20128/dashboard — add upstream provider
  # keys (Xiaomi MiMo, ...) there. Bound to 127.0.0.1 only: the dashboard
  # and API surface never leave this host.
  #
  # Mounts your local ~/.omniroute config so your configured provider keys
  # are reused. Stop any natively-running OmniRoute first to avoid two
  # processes sharing the same SQLite database.
  router:
    <<: *hardened
    build:
      context: .
      dockerfile: router.Dockerfile
    container_name: vibegpt-router
    ports:
      - "127.0.0.1:20128:20128" # Internal host access only
    environment:
      - PORT=20128
    volumes:
      - ~/.omniroute:/root/.omniroute
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:20128/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  # ── Next.js Web App ───────────────────────────────────────
  web:
    <<: *hardened
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    container_name: vibegpt-web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI Backend ────────────────────────────────────────
  api:
    <<: *hardened
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: vibegpt-api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vibegpt}:${POSTGRES_PASSWORD:-vibegpt_dev_password}@postgres:5432/${POSTGRES_DB:-vibegpt}
      OLLAMA_BASE_URL: http://ollama:11434
      GRAPHICS_SERVICE_URL: http://graphics:8010
      PYTHONPATH: /app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../services/api:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      graphics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Deterministic engineering-graphics renderer. It receives only the
  # subject-scoped excerpts selected by the authenticated VibeGPT API.
  graphics:
    <<: *hardened
    build:
      context: ../../GraphicsPythonVibeGPT/backend
      dockerfile: Dockerfile
    container_name: vibegpt-graphics
    ports:
      - "127.0.0.1:8010:8010"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Document Worker ────────────────────────────────────────
  worker:
    <<: *hardened
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: vibegpt-worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vibegpt}:${POSTGRES_PASSWORD:-vibegpt_dev_password}@postgres:5432/${POSTGRES_DB:-vibegpt}
      OLLAMA_BASE_URL: http://ollama:11434
      PYTHONPATH: /app
    volumes:
      - ../services/api:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: python -m app.workers.document_worker

volumes:
  pgdata:
    driver: local
  ollama_data:
    driver: local
  uploads:
    driver: local
